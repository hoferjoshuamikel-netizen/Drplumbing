name: Shopify Theme Check

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read
  checks: write

jobs:
  theme-check:
    name: Validate Liquid and theme JSON
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: .
          token: ${{ github.token }}
          base: main
          flags: --fail-level error
